<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    <script>
        function squareAndSum(... params) {
            let suma = 0;
            for (let index = 0; index < params.length; index++) {
                suma += square(params[index]);
            }

            return suma;
        }

        function square(n) {
            return n*n
        }

        document.write(`La suma de todos los cuadrados de estos números es ${squareAndSum(2, 4, 3)}`);
    </script>
</body>
</html>
