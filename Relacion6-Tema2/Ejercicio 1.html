<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        document.write("<table>");
        document.write("<tr><th>Propiedad</th><th>Valor</th></tr>");

        document.write("<tr><td><b>User Agent</b></td><td>" + navigator.userAgent + "</td></tr>");
        document.write("<tr><td><b>Idioma</b></td><td>" + navigator.language + "</td></tr>");
        document.write("<tr><td><b>Cookies</b></td><td>" + (navigator.cookieEnabled ? "Sí" : "No") + "</td></tr>");

        document.write("</table>");
    </script>
</body>
