<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>
    <script>
        let celsius = parseFloat(prompt("Dime una temperatura en Celsius"));
        let fahrenheit = parseFloat(prompt("Dime una temperatura en Fahrenheit"));

        function convertTemperature(c, f) {
            let fahrenheitResult = (c * 9 / 5) + 32;
            let celsiusResult = (f - 32) * 5 / 9;

            document.write(`${c}°C is ${fahrenheitResult}°F<br>`);
            document.write(`${f}°F is ${celsiusResult}°C`);
        }

        convertTemperature(celsius, fahrenheit);
    </script>
</body>
</html>
