<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        const colores = ["azul","amarillo","rojo","verde","café","rosa"];

        let color = prompt("Introduzca un color (todas en minúscula)");
        if (colores.includes(color)) {
            document.write(`${color} está en el array`);
        } else {
            document.write(`${color} NO está en el array`);
        }
    </script>
</body>
</html>
