<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15</title>
</head>
<body>
    <script>
      let segundos = 5;
      let timer;
      function actualizarContador() {
        console.log(segundos);

        if (segundos === 0) {
          clearInterval(timer);
          window.location.href = "https://www.pccomponentes.com/";
        } else {
          segundos--;
        }
      }

      document.write("Hemos cambiado de ubicación esta página. En breves momentos será redireccionado...<br>");
      timer = setInterval(actualizarContador, 1000);
    </script>
</body>
</html>
