<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16</title>
</head>
<body>
    <button onclick="abrirVentana()">Abrir ventana secundaria</button>
    <button onclick="cerrarVentana()">Cerrar ventana secundaria</button>
    <button onclick="enviarMensaje()">Envía un mensaje a la ventana secundaria</button>

    <script>
        let miVentana; 

        function abrirVentana() {
            miVentana = window.open("ventanaSecundaria.html", "Secundaria", "width=400, height=250, left=200");
        }

        function cerrarVentana() {
            if (miVentana && !miVentana.closed) {
                miVentana.close();
            }
        }

        function enviarMensaje() {
            if (miVentana && !miVentana.closed) {
                miVentana.recibeMensaje("Mensaje desde la ventana principal");
            }
        }
    </script>
</body>
</html>
