<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        let cumpleaños = new Date(prompt("Dame tu cumpleaños con este formato: \n(YYYY-MM-DD)"));

        for (let index = cumpleaños.getFullYear(); index <= 2100; index++) {
            cumpleaños.setFullYear(index);

            if (cumpleaños.getDay() === 0) { // Domingo es Day(0)
                console.log(cumpleaños.getFullYear());
            }
        }
    </script>
</body>
</html>
