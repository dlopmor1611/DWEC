<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        let opcion = parseInt(prompt("Introduzca una opción: \n 1. Potencia \n 2. Raíz \n 3. Redondeo \n 4. Trigonometría"));
        switch (opcion) {
            case 1:
                let x = parseInt(prompt("Introduzca la base"));
                let y = parseInt(prompt("Introduzca el exponente"));
                document.write(`La potencia de ${x} elevado a ${y} es: ${Math.pow(x,y)}`);
            break;
            case 2:
                let raiz = parseInt(prompt("Introduzca la raiz"));
                document.write(`La raiz de ${raiz} es: ${Math.sqrt(raiz)}`);
            break;
            case 3:
                let decimal = parseFloat(prompt("Introduzca un numero decimal"));
                document.write(`El redondeo a la baja es: ${Math.floor(decimal)}<br>`);
                document.write(`El redondeo al alza es: ${Math.round(decimal)}`);
            break;
            case 4:
                let angulo = parseInt(prompt("Introduzca un angulo"));
                if (angulo >= 0 && angulo <= 360) {
                    document.write(`El seno es: ${Math.sin(angulo)}<br>`);
                    document.write(`El coseno es: ${Math.cos(angulo)}<br>`);
                    document.write(`La tanjente es: ${Math.tan(angulo)}`);
                } else {
                    document.write(`Ángulo no válido`)
                }
            break;
            default:
                document.write("Elija una opcion entre 1-4");
            break;
        }
    </script>
</body>
</html>
