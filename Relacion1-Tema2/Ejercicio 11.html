<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>
<body>
    <script>
        let cadena = prompt("Introduzca una frase");
        let cadenaInversa = "";

        for (let index = cadena.length; index > 0; index--) {
            cadenaInversa += cadena[index];
        }

        document.write(`La cadena inversa es: ${cadenaInversa}`);
    </script>
</body>
</html>
