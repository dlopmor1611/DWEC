<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <script>
        let a = new Date();

        let h = a.getHours();
        let m = a.getMinutes();
        let s = a.getSeconds();

        document.write(`<p>${h}:${m}:${s}</p>`);
        document.write(`<p>Son las ${h}h y ${m}m</p>`);
    </script>
</body>
</html>
