<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    <script>
        let num1 = parseInt(prompt("Escriba un número"));
        let num2 = parseInt(prompt("Escriba otro número"));
        let num3 = parseInt(prompt("Escriba otro número"));

        if (num1 > num2 && num1 > num3) {
            document.write(`${num1} es el mayor`);
        } else if (num2 > num1 && num2 > num3) {
            document.write(`${num2} es el mayor`);
        } else {
            document.write(`${num3} es el mayor`);
        }
    </script>
</body>
</html>
