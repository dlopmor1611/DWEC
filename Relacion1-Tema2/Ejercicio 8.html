<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>
<body>
    <script>
        let contador = 0;
        let cadena = prompt("Introduzca una frase");
        for (let index = 0; index < cadena.length; index++) {
            if (cadena[index].toLowerCase() === 'a') {
                contador++;
            }
        }
        document.write(`La a aparece en la cadena ${contador} veces`);
    </script>
</body>
</html>
