<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>
        let base = parseInt(prompt("Introduzca la base de la potencia"));
        let exponente = parseInt(prompt("Introduzca el exponente de la potencia"));

        let respuesta = Math.pow(base,exponente);

        document.write(`La potencia es ${respuesta}`);
    </script>
</body>
</html>
