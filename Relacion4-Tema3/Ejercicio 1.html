<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        const numbers = [3, 12, 15, 8, 21, 6];
        const strings = ['apple', 'banana', 'islands', 'cat', 'oasis', 'history'];

        // 1. Find largest number
        const largestNumber = numbers.reduce((max, n) => (n > max ? n : max), numbers[0]);
        console.log('1. Largest number:', largestNumber);

        // 2. Find longest string
        const longestString = strings.reduce((longest, s) => (s.length > longest.length ? s : longest), '');
        console.log('2. Longest string:', longestString);

        // 3. Find even numbers
        const evenNumbers = numbers.filter(n => n % 2 === 0);
        console.log('3. Even numbers:', evenNumbers);

        // 4. Find odd numbers
        const oddNumbers = numbers.filter(n => n % 2 !== 0);
        console.log('4. Odd numbers:', oddNumbers);

        // 5. Find words that contain 'is'
        const wordsWithIs = strings.filter(s => s.includes('is'));
        console.log('5. Words with "is":', wordsWithIs);

        // 6. Assert all numbers are divisible by three
        const allDivisibleByThree = numbers.every(n => n % 3 === 0);
        console.log('6. All divisible by three:', allDivisibleByThree);

        // 7. Zip two arrays together
        const zip = (arr1, arr2) => arr1.map((item, index) => [item, arr2[index]]);
        const zipped = zip([1, 2, 3], ['a', 'b', 'c']);
        console.log('7. Zipped:', zipped);

        // 8. Sort joined array from smallest to largest
        const sortedNumbers = [...numbers].sort((a, b) => a - b);
        console.log('8. Sorted numbers:', sortedNumbers);

        // 9. Remove the first word in the array
        const withoutFirstWord = strings.slice(1);
        console.log('9. Without first word:', withoutFirstWord);

        // 10. Place a new word at the start of the array
        const withNewWordAtStart = ['mango', ...strings];
        console.log('10. With new word at start:', withNewWordAtStart);

        // 11. Replace some elements (e.g., replacing even indexes with 'grape')
        const replacedElements = strings.map((s, index) => (index % 2 === 0 ? 'grape' : s));
        console.log('11. Replaced elements:', replacedElements);
    </script>
</body>
</html>
