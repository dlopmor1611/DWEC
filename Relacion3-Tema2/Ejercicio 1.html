<body>
    <script>
        document.write("Palabra pasada es: Luis tiene un coche rojo <br><br>")

        document.write(`La cadena inversa es: ${invierteCadena("Luis tiene un coche rojo")}<br>`);
        document.write(`La cadena con las palabras invertidas es: ${inviertePalabras("Luis tiene un coche rojo")}<br>`);
        document.write(`La longitud de la palabra más larga es: ${encuentraPalabraMasLarga("Luis tiene un coche rojo")}<br>`);
        document.write(`El número de palabras cuya longitud es mayor a 4 es: ${filtraPalabrasMasLargas("Luis tiene un coche rojo", 4)}<br><br>`);

        document.write("Salvo aquí que le paso: luis Tiene Un Coche Rojo<br><br>")
        document.write(`La cadena bien formada es: ${cadenaBienFormada("luis Tiene Un Coche Rojo")}`);
    </script>
