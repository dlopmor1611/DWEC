<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>
        for (let index = 1; index <=  10; index++) {
            document.write(`<b>Tabla del ${index}</b><br>`);
            for (let jindex = 1; jindex <= 10; jindex++) {
                
                document.write(`${index} x ${jindex} = ${index*jindex}<br>`);
            }
        }
    </script>
</body>
</html>
