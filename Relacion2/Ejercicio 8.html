<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>

<body>

    <script>
        let alto = parseInt(prompt("Introduzca la altura y anchura de la tabla en píxeles"));

        document.write(`<table border="0" cellspacing="2" bgcolor="black" width="${alto * 8}">`);

        for (let index = 0; index < 8; index++) {
            document.write(`<tr height="${alto}">`);

            for (let jindex = 0; jindex < 8; jindex++) {
                if (index%2 != 0) {
                    document.write(`<td ${jindex % 2 != 0 ? "bgcolor=black" : "bgcolor=white"} width="${alto} ">&nbsp;</td>`);
                } else {
                    document.write(`<td ${jindex % 2 === 0 ? "bgcolor=black" : "bgcolor=white"} width="${alto} ">&nbsp;</td>`);
                }
            }

            document.write(`</tr>`);
        }

        document.write(`</table>`);
    </script>

</body>

</html>
