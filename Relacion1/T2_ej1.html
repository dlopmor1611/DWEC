<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        document.write(`
            <div>
                <p>La operación 20==20 es ${20==20}</p>
                <p>La operación 20===20 es ${20===20}</p>
                <p>La operación 20===20.0 es ${20===20.0}</p>
                <p>La operación "Juan"=="juan" es ${"Juan"=="juan"}</p>
                <p>La operación "Juan">"juan" es ${"Juan">"juan"}</p>
                <p>La operación "Juan"<"juan" es ${"Juan"<"juan"}</p>
                <p>La operación "123"==123 es ${"123"==123}</p>
                <p>La operación "123"===123 es ${"123"===123}</p>
                <p>La operación parseInt("123")===123 es ${parseInt("123")===123}</p>
            </div>
        `);
    </script>
</body>
</html>
