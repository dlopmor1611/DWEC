<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        var countdown = prompt("Introduce un número para iniciar la cuenta atrás");
        while (countdown > 0) {
          alert(countdown + "... ");  
          countdown--;
          /* countdown++; esta linea hace que se cree un bucle infinito porque nunca se cumple la condición 
          para salir porque siempre está sumando por lo que nunca llegará a 0*/
        };
    </script>
</body>
</html>
