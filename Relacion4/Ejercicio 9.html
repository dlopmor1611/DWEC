<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt("Dame un número para comprobar si tiene 3 dígitos"));

        function tieneTresDigitos(num) {
            if (num >= 100 && num <= 999 ) {
                document.write(`${num} es un número de 3 dígitos`);
            } else {
                document.write(`${num} no es un número de 3 dígitos`);
            }
        }

        tieneTresDigitos(numero);
    </script>
</body>
</html>
