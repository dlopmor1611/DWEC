<body>
    <script>
        let sumaNumeros = 0;

        function sum(... args) {
            let suma = 0;
            for (let index = 0; index < args.length; index++) {
                suma += args[index];
            }
            return suma;
        }
        
        document.write(`La suma de esos números es ${suma(2,5,2,7)}`);
    </script>
