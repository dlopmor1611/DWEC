<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>
<body>
    <script>
        let ancho = parseInt(prompt("Dame el ancho del rectángulo"));
        let largo = parseInt(prompt("Dame el lago del rectángulo"));

        function areaRectangulo(a, l) {
            return a * l;            
        }

        document.write(`El área del rectángulo es ${areaRectangulo(ancho, largo)}`);
    </script>
</body>
</html>
