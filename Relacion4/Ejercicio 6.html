<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt("Dame un número para comprobar si es divisible por 3"));

        function divisible(n) {
            if (n%3 === 0) {
                document.write(`${n} es divisible por 3`);
            } else {
                document.write(`${n} NO es divisible por 3`);
            }    
        }

        divisible(numero);
    </script>
</body>
</html>
