<body>
    <script>
        let suma = 0;
        function sumEveryOther(... args) {
            let sum = 0;
            for (let index = 0; index < args.length; index++) {
                if (index%2 === 0) {
                    sum+=args[index];
                }
            }

            return sum;
        }
        document.write(`La suma de esos números es ${sumEveryOther(2,3,7,7,4,6)}`);
    </script>
</body>
